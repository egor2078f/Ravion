<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptHub | Roblox Scripts</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #111216; /* ScriptBlox dark style */
            --card: #1f2128;
            --accent: #7289da;
            --text: #ffffff;
            --text-gray: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

        /* Navbar */
        nav {
            background: var(--card); padding: 15px 5%; display: flex; 
            justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2c35;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); text-transform: uppercase; }
        .nav-links a { color: var(--text-gray); text-decoration: none; margin-left: 20px; transition: 0.3s; }
        .nav-links a:hover { color: var(--text); }

        /* Search Section */
        .search-area {
            padding: 40px 20px; text-align: center; background: radial-gradient(circle at top, #1e212b 0%, var(--bg) 70%);
        }
        .search-box {
            position: relative; max-width: 600px; margin: 0 auto;
        }
        .search-box input {
            width: 100%; padding: 15px 50px 15px 20px; border-radius: 8px; border: none;
            background: #252830; color: #fff; font-size: 1rem; outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .search-box i {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--text-gray);
        }

        /* Filter Tabs */
        .filters { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .filter-btn {
            background: transparent; border: 1px solid #333; color: var(--text-gray);
            padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; flex: 1; }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }

        /* Card Design (Like ScriptBlox) */
        .card {
            background: var(--card); border-radius: 10px; overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #2a2c35;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: var(--accent); }

        .card-img {
            height: 140px; background: #2a2c35; background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; color: #444;
        }
        
        .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        .game-tag { font-size: 0.75rem; color: var(--accent); font-weight: 600; text-transform: uppercase; margin-bottom: 5px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
        
        .card-meta {
            margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid #2a2c35;
        }
        .meta-info { font-size: 0.8rem; color: var(--text-gray); }
        
        .btn-copy {
            background: #2c2f3a; color: white; border: none; padding: 8px 15px;
            border-radius: 5px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.2s;
        }
        .btn-copy:hover { background: var(--accent); }

        /* Not Found State */
        .not-found {
            grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-gray);
        }
        .not-found i { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; }
        .not-found h2 { font-size: 1.5rem; color: white; }

        /* Toast Notification */
        .toast {
            position: fixed; bottom: 30px; right: 30px; background: var(--accent); color: white;
            padding: 12px 24px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: translateY(100px); opacity: 0; transition: 0.3s; z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .search-box { width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ScriptHub</div>
        <div class="nav-links">
            <a href="#" onclick="filterScripts('all')">Home</a>
            <a href="https://discord.com" target="_blank">Discord</a>
        </div>
    </nav>

    <div class="search-area">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search scripts...">
            <i class="fas fa-search"></i>
        </div>
        <div class="filters">
            <button class="filter-btn active" onclick="filterType('all', this)">All</button>
            <button class="filter-btn" onclick="filterType('universal', this)">Universal</button>
            <button class="filter-btn" onclick="filterType('game', this)">Games</button>
        </div>
    </div>

    <div class="container">
        <div class="grid" id="scriptGrid">
            </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        let allScripts = [];
        let currentFilter = 'all';

        // 1. Загрузка базы данных
        async function loadScripts() {
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = '<div class="not-found"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>';

            try {
                // Пытаемся найти файл database.json
                const response = await fetch('database.json');
                if (!response.ok) throw new Error("Database not found");
                allScripts = await response.json();
                renderScripts(allScripts);
            } catch (error) {
                console.error(error);
                // Если файла нет или ошибка - показываем Not Found
                renderErrorState();
            }
        }

        // 2. Рендеринг (Отрисовка)
        function renderScripts(data) {
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = '';

            if (data.length === 0) {
                renderErrorState();
                return;
            }

            data.forEach(script => {
                // Если нет картинки, ставим заглушку
                const bgStyle = script.image 
                    ? `background-image: url('${script.image}')` 
                    : `background: linear-gradient(45deg, #2a2c35, #1f2128)`;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img" style="${bgStyle}">
                        ${!script.image ? '<i class="fas fa-gamepad fa-2x"></i>' : ''}
                    </div>
                    <div class="card-body">
                        <div class="game-tag">${script.game}</div>
                        <div class="card-title">${script.title}</div>
                        <div class="card-meta">
                            <span class="meta-info">${script.date || 'Recently'}</span>
                            <button class="btn-copy" onclick="copyToClipboard('${escapeStr(script.code)}')">
                                Copy Script
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 3. Состояние "Не найдено" (как просил)
        function renderErrorState() {
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = `
                <div class="not-found">
                    <i class="fas fa-box-open"></i>
                    <h2>Scripts not found</h2>
                    <p>Try changing your search query.</p>
                </div>
            `;
        }

        // 4. Поиск и Фильтрация
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allScripts.filter(s => {
                const matchesSearch = s.title.toLowerCase().includes(val) || s.game.toLowerCase().includes(val);
                const matchesType = currentFilter === 'all' || s.type === currentFilter;
                return matchesSearch && matchesType;
            });
            renderScripts(filtered);
        });

        function filterType(type, btn) {
            currentFilter = type;
            
            // UI кнопок
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Trigger search update to re-render
            searchInput.dispatchEvent(new Event('input'));
        }

        // 5. Копирование
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        // Вспомогательная функция для экранирования кавычек в коде
        function escapeStr(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Старт
        loadScripts();
    </script>
</body>
</html>
