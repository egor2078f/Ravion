<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVION Scripts</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-vsc-dark-plus.min.css" rel="stylesheet" />

    <style>
        :root {
            --bg-body: #0d1117; /* Цвет фона GitHub Dark */
            --bg-card: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff; /* Синий акцент */
            --accent-hover: #79c0ff;
            --radius: 6px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Header */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Search Area */
        .controls {
            margin: 2rem 0;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius);
            font-family: inherit;
            min-width: 250px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: var(--text-muted);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .game-label {
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .card h3 {
            font-size: 16px;
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 0.5rem;
        }

        .card p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .btn {
            background: #21262d;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }

        .btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }

        .btn-primary {
            background: #238636;
            border-color: rgba(240,246,252,0.1);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #2ea043;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            overflow: auto;
            background: #0d1117;
            position: relative;
        }

        pre { margin: 0 !important; border-radius: 0 !important; }

        .modal-footer {
            padding: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Error state */
        .error-msg {
            color: #f85149;
            text-align: center;
            padding: 2rem;
            border: 1px solid rgba(248, 81, 73, 0.4);
            border-radius: var(--radius);
            background: rgba(248, 81, 73, 0.1);
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-flex">
            <a href="#" class="logo">
                <i class="fas fa-code-branch"></i>
                RAVION Repository
            </a>
            <div style="font-size: 12px; color: var(--text-muted);">
                Scripts v1.0
            </div>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск скрипта по названию или игре...">
        </div>

        <div id="error-box" class="error-msg"></div>
        <div class="grid" id="grid">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">
                Загрузка данных...
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Script Source</h3>
                <button class="btn" id="closeModal" style="border:none; background:none;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <pre><code class="language-lua" id="modalCode"></code></pre>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="copyBtn">
                    <i class="far fa-copy"></i> Копировать код
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>

    <script>
        let allScripts = [];

        // 1. Загрузка данных из внешнего файла
        async function fetchScripts() {
            const grid = document.getElementById('grid');
            const errorBox = document.getElementById('error-box');

            try {
                const response = await fetch('scripts.json');
                
                if (!response.ok) {
                    throw new Error(`Ошибка загрузки: ${response.status}`);
                }

                allScripts = await response.json();
                renderScripts(allScripts);

            } catch (error) {
                grid.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.innerHTML = `
                    <h3>Не удалось загрузить скрипты</h3>
                    <p>${error.message}</p>
                    <br>
                    <small>Если вы открыли файл просто в браузере (file://), то это не сработает из-за защиты браузера.</small>
                    <small>Используйте локальный сервер (Live Server) или загрузите сайт на GitHub Pages/хостинг.</small>
                `;
            }
        }

        // 2. Отрисовка карточек
        function renderScripts(scripts) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            if (scripts.length === 0) {
                grid.innerHTML = '<div style="color: var(--text-muted)">Ничего не найдено</div>';
                return;
            }

            scripts.forEach(script => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-top">
                        <span class="game-label">${script.game}</span>
                    </div>
                    <h3>${script.title}</h3>
                    <p>${script.desc}</p>
                    <button class="btn" onclick="openScript(${script.id})">
                        <i class="fas fa-code"></i> Показать код
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // 3. Поиск
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allScripts.filter(s => 
                s.title.toLowerCase().includes(val) || 
                s.game.toLowerCase().includes(val)
            );
            renderScripts(filtered);
        });

        // 4. Модальное окно
        const modal = document.getElementById('modalOverlay');
        const modalCode = document.getElementById('modalCode');
        const modalTitle = document.getElementById('modalTitle');

        window.openScript = (id) => {
            const script = allScripts.find(s => s.id === id);
            if (!script) return;

            modalTitle.textContent = script.title;
            modalCode.textContent = script.code;
            
            modal.classList.add('active');
            Prism.highlightElement(modalCode); // Подсветка кода
        };

        // Закрытие модалки
        document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        // Копирование
        document.getElementById('copyBtn').addEventListener('click', function() {
            navigator.clipboard.writeText(modalCode.textContent).then(() => {
                const originalText = this.innerHTML;
                this.innerHTML = '<i class="fas fa-check"></i> Скопировано';
                setTimeout(() => {
                    this.innerHTML = originalText;
                }, 2000);
            });
        });

        // Запуск при загрузке
        fetchScripts();
    </script>
</body>
</html>
